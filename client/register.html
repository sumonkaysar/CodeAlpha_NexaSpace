<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account | NexaSpace</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">Nexa<span>Space</span></a>
    </header>
    <main class="auth-wrap">
      <form class="auth-form" id="auth-form" data-mode="register">
        <p class="eyebrow">YOUR NEXT ROOM</p>
        <h1>Create account</h1>
        <label
          >Name<input
            name="name"
            required
            minlength="2"
            autocomplete="name" /></label
        ><label
          >Email<input
            name="email"
            type="email"
            required
            autocomplete="email" /></label
        ><label
          >Password<input
            name="password"
            type="password"
            required
            minlength="8"
            autocomplete="new-password" /></label
        ><button class="button" type="submit">Create account</button>
        <p id="form-message" role="status"></p>
        <p>Already have an account? <a href="login.html">Sign in</a></p>
      </form>
    </main>
    <script src="js/common.js"></script>
    <script src="js/rooms.js"></script>
    <script src="js/media.js"></script>
    <script src="js/files.js"></script>
    <script src="js/whiteboard.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
